# Native 64-bit Windows build of pdf2htmlEX 0.18.8.rc1 (no official Windows
# binary exists past 0.14.6, a 32-bit build from 2015).
# Builds with MSYS2/MINGW64, smoke-tests the result outside MSYS2, then
# publishes it as the "engine" release consumed by the RockTranslate installer
# (release.yml) and by the on-demand download (core/downloader.py).
name: pdf2htmlEX Windows engine

on:
  workflow_dispatch:
  push:
    branches: [dev, second, main]
    paths:
      - "tools/pdf2htmlex-windows/**"
      - ".github/workflows/pdf2htmlex-windows.yml"

permissions:
  contents: read

# A newer push supersedes a running attempt
concurrency:
  group: pdf2htmlex-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_VERSION: 0.18.8.rc1-win64

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git curl tar xz patch zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext-runtime
            mingw-w64-x86_64-gettext-tools
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-boost

      - name: Build pdf2htmlEX
        run: |
          gcc --version | head -1
          WORK="$PWD/build-win" OUT="$PWD/pdf2htmlEX-win64" JOBS=4 \
            bash tools/pdf2htmlex-windows/build.sh

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-win/**/CMakeFiles/CMakeConfigureLog.yaml
            build-win/**/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

      - name: Smoke test (plain Windows, no MSYS2 on PATH)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path pdf2htmlEX-win64/bin/pdf2htmlEX.exe).Path
          New-Item -ItemType Directory -Force smoke | Out-Null
          Set-Location smoke
          Copy-Item ../build-win/pdf2htmlEX/test/test_output/3-pages.pdf .
          Invoke-WebRequest https://arxiv.org/pdf/1706.03762v7 -OutFile attention.pdf
          Invoke-WebRequest https://arxiv.org/pdf/1512.03385v1 -OutFile resnet.pdf
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          $summary = "| pdf | seconds | html MB |`n|---|---|---|`n"
          foreach ($pdf in @("3-pages.pdf", "attention.pdf", "resnet.pdf")) {
            $out = ($pdf -replace '\.pdf$', '') + ".html"
            $t = Measure-Command { & $exe --zoom 1.3 --no-drm 1 --embed-image 0 $pdf $out 2>&1 | Out-Null }
            if (-not (Test-Path $out)) { throw "no HTML produced for $pdf" }
            $summary += "| $pdf | $([math]::Round($t.TotalSeconds,1)) | $([math]::Round((Get-Item $out).Length / 1MB, 2)) |`n"
          }
          Write-Host $summary
          $summary | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Package
        run: |
          cd pdf2htmlEX-win64
          zip -qr "../pdf2htmlEX-$ENGINE_VERSION.zip" .
          cd ..
          sha256sum "pdf2htmlEX-$ENGINE_VERSION.zip" | tee "pdf2htmlEX-$ENGINE_VERSION.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2htmlEX-engine
          path: |
            pdf2htmlEX-${{ env.ENGINE_VERSION }}.zip
            pdf2htmlEX-${{ env.ENGINE_VERSION }}.zip.sha256
          retention-days: 30

  publish:
    # Engine release (regular, never "latest"): the stable download URL
    # used by the installer build and by the app's on-demand download.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf2htmlEX-engine
      - name: Create or update the engine release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="engine-pdf2htmlex-$ENGINE_VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              echo "Native 64-bit Windows build of pdf2htmlEX 0.18.8.rc1 (Poppler 0.89.0, FontForge 20200314),"
              echo "used by RockTranslate as its PDF layout engine on Windows."
              echo
              echo "pdf2htmlEX is GPL v3 software: see README.txt and LICENSE_GPLv3 in the archive for the"
              echo "corresponding sources and the build recipe (tools/pdf2htmlex-windows)."
            } > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
              --title "pdf2htmlEX $ENGINE_VERSION (Windows engine)" --notes-file notes.md
          fi
          gh release upload "$TAG" --clobber pdf2htmlEX-$ENGINE_VERSION.zip pdf2htmlEX-$ENGINE_VERSION.zip.sha256
