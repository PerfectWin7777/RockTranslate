<!-- 
  RockTranslate — Reactive Asynchronous Dual-Progress Panel Component
  Path: src/rocktranslate/assets/ui/components/progress.html
-->

<div id="progress-container" x-data="progressController()" x-show="visible && currentScreen === 'workspace'"
    x-transition:enter="progress-enter" x-transition:enter-start="progress-enter-start"
    x-transition:enter-end="progress-enter-end" x-transition:leave="progress-leave"
    x-transition:leave-start="progress-leave-start" x-transition:leave-end="progress-leave-end" x-cloak>

    <!-- Panel controls (VS Code style): collapse / expand, close -->
    <div class="progress-panel-actions">
        <button class="progress-panel-btn" @click="toggleCollapsed()"
            :title="$store.i18n.translate(collapsed ? 'panel_expand' : 'panel_collapse')"
            x-text="collapsed ? '▴' : '▾'"></button>
        <button class="progress-panel-btn" @click="closePanel()"
            :title="$store.i18n.translate('panel_close')">✕</button>
    </div>

    <!-- Collapsed: one compact line -->
    <div class="progress-compact" x-show="collapsed">
        <span x-text="$store.i18n.translate('prop_pages_progress', { done: donePages, total: totalPages })"></span>
        <span class="progress-compact-sep">·</span>
        <span x-text="$store.i18n.translate('prop_segments_progress', { done: doneSegments, total: totalSegments })"></span>
        <span class="progress-compact-sep" x-show="getUsageLine()">·</span>
        <span class="progress-stats" x-text="getUsageLine()"></span>
    </div>

    <template x-if="!collapsed"><div class="progress-full">
    <!-- 1. Global Document Progress Row (Blue) -->
    <div class="progress-row">
        <div class="progress-label-row">
            <span class="progress-left-text"
                x-text="$store.i18n.translate('prop_pages_progress', { done: donePages, total: totalPages })"></span>
            <span class="progress-right-text" x-text="totalPages ? getPercentText() : ''"></span>
        </div>
        <div class="progress-bar-track">
            <div class="progress-bar-chunk blue" :style="`width: ${getPagesPercent()}%`"></div>
        </div>
    </div>

    <!-- 2. Local Segment Progress Row (Green) -->
    <div class="progress-row">
        <div class="progress-label-row">
            <span class="progress-left-text"
                x-text="$store.i18n.translate('prop_segments_progress', { done: doneSegments, total: totalSegments })"></span>
            <span class="progress-right-text" x-text="getBatchSpeedLabel()"></span>
        </div>
        <div class="progress-bar-track">
            <div class="progress-bar-chunk green" :style="`width: ${getSegmentsPercent()}%`"></div>
        </div>
    </div>

    <!-- 3. Live run statistics -->
    <div class="progress-stats-row">
        <span class="progress-stats" x-text="getUsageLine()"></span>
        <span class="progress-model" x-text="getModelLabel()"></span>
    </div>
    </div></template>

</div>
